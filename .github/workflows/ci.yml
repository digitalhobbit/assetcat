name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Tests
        run: uv run --locked --python 3.12 pytest -v
      - name: Wheel includes the web UI and starter files
        shell: bash
        run: |
          uv build --wheel -o dist
          uv run --no-project python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); need=['assetcat/web/index.html','assetcat/web/app.js','assetcat/web/vendor/preact-htm.js','assetcat/starter/licenses.toml','assetcat/starter/tags.toml']; missing=[x for x in need if x not in n]; sys.exit(f'missing: {missing}' if missing else 0)"
      - name: CLI runs from the built wheel
        shell: bash
        run: |
          uvx --from dist/*.whl assetcat --version
          uv run --locked --python 3.12 python tests/make_library.py demo-lib
          export ASSETCAT_CONFIG="$PWD/demo-config.toml" ASSETCAT_CACHE="$PWD/demo-cache"
          uvx --from dist/*.whl assetcat init demo-lib
          uvx --from dist/*.whl assetcat index
          uvx --from dist/*.whl assetcat stats

  # A pushed tag vX.Y.Z publishes to PyPI once the tests pass on all three systems. Trusted
  # publishing: PyPI trusts this workflow in this repo (set up once on pypi.org), so no token.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tag matches the package version
        run: |
          v=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but pyproject.toml says $v"; exit 1; }
      - name: README links for PyPI (absolute, pinned to this tag)
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          sed -i -e "s#](docs/#](${raw}/docs/#g" -e "s#src=\"src/#src=\"${raw}/src/#g" \
                 -e "s#](CLAUDE.md)#](${blob}/CLAUDE.md)#g" -e "s#](LICENSE)#](${blob}/LICENSE)#g" README.md
          ! grep -nE '\]\((docs|src)/|src="(docs|src)/|\]\((CLAUDE.md|LICENSE)\)' README.md
      - run: uv build
      - run: uv publish --trusted-publishing always
